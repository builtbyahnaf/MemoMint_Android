plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'dev.builtbyahnaf.memomint'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "dev.builtbyahnaf.memomint"
        minSdk 30
        targetSdk 37
        versionCode 1047648
        versionName "1.014.7-S"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Allows Robolectric tests to use Android framework classes
            // (SQLiteDatabase, Context, etc.) on the JVM without a device.
            includeAndroidResources = true
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    testImplementation libs.robolectric
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}