plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'dev.builtbyahnaf.memomint'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "dev.builtbyahnaf.memomint"
        minSdk 30
        targetSdk 37
        versionCode 1042486
        versionName "1.014.2-D"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            // Allows Robolectric tests to use Android framework classes
            // (SQLiteDatabase, Context, etc.) on the JVM without a device.
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    // Bundled SQLite with FTS5 compiled in. The system SQLite on Android API 30–35
    // may not include FTS5, causing "no such module: fts5" at runtime when the
    // memories_fts virtual table is created. This AAR ships its own native SQLite
    // shared library (~2 MB) and transparent Java wrapper that delegates all
    // SQLiteOpenHelper, SQLiteDatabase, and Cursor calls to the bundled engine.
    implementation libs.sqlite.android

    //implementation 'com.github.requery:sqlite-android:3.50.4'
    testImplementation libs.junit
    testImplementation libs.robolectric
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}